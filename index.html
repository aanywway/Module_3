<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Stage 3</title>
</head>
<body>
    <section class="input-container">
        <form class="form">
            <div class="form-group">
                <label for="name"></label>
                <input type="text" id="name" name="name" placeholder="Enter name" class="input-field" required>
            </div>
            <div class="form-group">
                <label for="image"></label>
                <input type="file" id="image" name="image" required>
            </div>

            <button type="submit" class="form-btn">Add to Gallery</button>
        </form>
    </section>
    <main class="gallery-container">
        <div class="list-container">
            <section class="image-list"></section>
            <button class="scroll-to-top hidden">&#8593</button>
        </div>
        <div class="resize-bar"></div>
        <section class="preview-area">
            <div class="coordinates-display hidden">
                <span>X</span>
                <span class="coord-x">0</span>
                <span>Y</span>
                <span class="coord-y">0</span>
            </div>
            <div class="preview-container">
                <img class="preview-image hidden">
            </div>
            <div class="btn-container">
                <button class="previous-btn hidden">&#8592</button>
                <button class="next-btn hidden">&#8594</button>
            </div>
            <span class="close-icon">&#9747</span>
        </section>
    </main>



    <script src="dom-elements.js"></script>
    <script src="images.js"></script>
    <script src="scroll-to-top.js"></script>
    <script src="preview-close.js"></script>
    <script src="image-preview.js"></script>
    <script src="submit-form.js"></script>
    <script src="drag-and-drop.js"></script>
    <script src="resize.js"></script>
</body>
</html>
